# Orquestrador — HTTPS auto-assinado (opção A: acesso por IP, sem LB).
# TLS termina aqui. A mesma VM serve:
#   /        -> SPA estático (dist-negociacoes) em /var/www/kito-spa
#   /api/    -> Node (orquestrador) em localhost:3000
#   /ws/     -> Node faz o túnel até a VM browser interna
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/kito-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/kito-selfsigned.key;

    client_max_body_size 10M;

    root /var/www/kito-spa;
    index index.html;

    # SPA (fallback para index.html em rotas do cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do orquestrador (Express :3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de cada navegador -> Node faz o túnel até a VM browser interna.
    # Sem barra final em proxy_pass: o prefixo /ws/<port>/ é preservado para o Node.
    location ~ ^/ws/(?<port>\d+)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
